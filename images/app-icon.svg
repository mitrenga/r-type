<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">R-TYPE — Cold Steel</title>
<desc id="desc">Angular R-9 inspired fighter and incandescent plasma shot on midnight blue. Editable vector master with separate background and foreground groups. C64-inspired restrained colors and stepped forms.</desc><defs>
  <radialGradient id="space" cx="60%" cy="42%" r="76%"><stop stop-color="#19233d"/><stop offset=".55" stop-color="#0b1020"/><stop offset="1" stop-color="#04060c"/></radialGradient>
  <radialGradient id="aura"><stop stop-color="#ff7438" stop-opacity=".26"/><stop offset=".45" stop-color="#c94327" stop-opacity=".12"/><stop offset="1" stop-color="#c94327" stop-opacity="0"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#e1e5e9"/><stop offset=".48" stop-color="#9eafc3"/><stop offset=".49" stop-color="#657790"/><stop offset="1" stop-color="#344159"/></linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9b8cb"/><stop offset="1" stop-color="#34435d"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#c1f8ff"/><stop offset=".35" stop-color="#69c8df"/><stop offset="1" stop-color="#235177"/></linearGradient>
  <linearGradient id="exhaust"><stop stop-color="#70c4f3" stop-opacity="0"/><stop offset="1" stop-color="#9be8ff" stop-opacity=".85"/></linearGradient>
  <radialGradient id="plasma" cx="42%" cy="42%"><stop stop-color="#ffffe2"/><stop offset=".35" stop-color="#ffe8a1"/><stop offset=".7" stop-color="#ffad51"/><stop offset="1" stop-color="#e94c2e"/></radialGradient>
</defs><g id="background"><rect width="1024" height="1024" fill="url(#space)"/>
